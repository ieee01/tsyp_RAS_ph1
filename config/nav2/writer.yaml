"/writer/bt_navigator":
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: writer/base_link
    odom_topic: /writer/odom
    bt_loop_duration: 10
    default_server_timeout: 100
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator

"/writer/controller_server":
  ros__parameters:
    use_sim_time: true
    controller_frequency: 12.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.3
      movement_time_allowance: 12.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.35
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.55
      lookahead_dist: 0.6
      use_velocity_scaled_lookahead_dist: true
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.0
      rotate_to_heading_angular_vel: 1.0
      use_rotate_to_heading: true
      transform_tolerance: 0.2

"/writer/planner_server":
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 10.0
    costmap_update_timeout: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

"/writer/behavior_server":
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    local_frame: writer/odom
    global_frame: map
    robot_base_frame: writer/base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait

"/writer/local_costmap/local_costmap":
  ros__parameters:
    use_sim_time: true
    update_frequency: 8.0
    publish_frequency: 4.0
    global_frame: writer/odom
    robot_base_frame: writer/base_link
    rolling_window: true
    width: 4
    height: 4
    resolution: 0.05
    footprint: "[[0.35, 0.32], [0.35, -0.32], [-0.35, -0.32], [-0.35, 0.32]]"
    plugins: [obstacle_layer, inflation_layer]
    obstacle_layer:
      plugin: nav2_costmap_2d::ObstacleLayer
      enabled: true
      observation_sources: scan
      scan:
        topic: /writer/scan
        max_obstacle_height: 2.0
        clearing: true
        marking: true
        data_type: LaserScan
        raytrace_max_range: 8.0
        raytrace_min_range: 0.0
        obstacle_max_range: 7.0
        obstacle_min_range: 0.0
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      cost_scaling_factor: 4.0
      inflation_radius: 0.55
    always_send_full_costmap: true

"/writer/global_costmap/global_costmap":
  ros__parameters:
    use_sim_time: true
    update_frequency: 3.0
    publish_frequency: 2.0
    global_frame: map
    robot_base_frame: writer/base_link
    footprint: "[[0.35, 0.32], [0.35, -0.32], [-0.35, -0.32], [-0.35, 0.32]]"
    resolution: 0.05
    track_unknown_space: true
    plugins: [static_layer, obstacle_layer, inflation_layer]
    static_layer:
      plugin: nav2_costmap_2d::StaticLayer
      map_topic: /map
      map_subscribe_transient_local: true
    obstacle_layer:
      plugin: nav2_costmap_2d::ObstacleLayer
      enabled: true
      observation_sources: scan
      scan:
        topic: /writer/scan
        clearing: true
        marking: true
        data_type: LaserScan
        raytrace_max_range: 8.0
        raytrace_min_range: 0.0
        obstacle_max_range: 7.0
        obstacle_min_range: 0.0
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      cost_scaling_factor: 4.0
      inflation_radius: 0.55
    always_send_full_costmap: true
