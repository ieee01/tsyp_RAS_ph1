<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">Physical prototype implementation roadmap</title><desc id="desc">Eight-week plan to 1 December 2026, progressing from firmware and measured radios to robot bases, dispenser, autonomy, gateway integration, failure testing and delivery. Planned work, not completed hardware.</desc>
