<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">Mission continuity in six steps</title><desc id="desc">The Writer senses and deposits memories, the mesh carries them to the gateway, Executors receive briefs and write results back into the same beacons.</desc>
<rect x="0" y="0" width="1200" height="440" rx="0" fill="#ffffff" stroke="none"/>
<text x="32" y="31" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#168575">02 / MISSION CONTINUITY</text>
<text x="32" y="67" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#14293d">Explore. Preserve. Continue.</text>
<text x="32" y="96" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#607286">The command post chooses WHO and WHAT. Each robot decides HOW.</text>
<circle cx="50" cy="145" r="20" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<text x="50" y="152" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="white">01</text>
<text x="28" y="205" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#14293d">Explore</text>
<text x="28" y="241" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#607286">Writer maps the mine</text>
<text x="28" y="263" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#607286">and senses events</text>
<line x1="89" y1="145" x2="194" y2="145" stroke="#dce4ec" stroke-width="2"/>
<polygon points="194,145 185.8959760788259,148.91468980700108 185.8959760788259,141.08531019299892" fill="#dce4ec"/>
<circle cx="243" cy="145" r="20" fill="#168575" stroke="#168575" stroke-width="2"/>
<text x="243" y="152" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="white">02</text>
<text x="221" y="205" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#14293d">Record</text>
<text x="221" y="241" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#607286">Safe-standoff beacon</text>
<text x="221" y="263" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#607286">stores what / where / when</text>
<line x1="282" y1="145" x2="387" y2="145" stroke="#dce4ec" stroke-width="2"/>
<polygon points="387,145 378.8959760788259,148.91468980700108 378.8959760788259,141.08531019299892" fill="#dce4ec"/>
<circle cx="436" cy="145" r="20" fill="#168575" stroke="#168575" stroke-width="2"/>
<text x="436" y="152" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="white">03</text>
<text x="414" y="205" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#14293d">Relay</text>
<text x="414" y="241" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#607286">Beacons forward</text>
<text x="414" y="263" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#607286">through rock-wall RF links</text>
<line x1="475" y1="145" x2="580" y2="145" stroke="#dce4ec" stroke-width="2"/>
<polygon points="580,145 571.8959760788259,148.91468980700108 571.8959760788259,141.08531019299892" fill="#dce4ec"/>
<circle cx="629" cy="145" r="20" fill="#168575" stroke="#168575" stroke-width="2"/>
<text x="629" y="152" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="white">04</text>
<text x="607" y="205" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#14293d">Translate</text>
<text x="607" y="241" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#607286">Gateway converts</text>
<text x="607" y="263" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#607286">map coordinates to GPS</text>
<line x1="668" y1="145" x2="773" y2="145" stroke="#dce4ec" stroke-width="2"/>
<polygon points="773,145 764.8959760788259,148.91468980700108 764.8959760788259,141.08531019299892" fill="#dce4ec"/>
<circle cx="822" cy="145" r="20" fill="#dc6a32" stroke="#dc6a32" stroke-width="2"/>
<text x="822" y="152" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="white">05</text>
<text x="800" y="205" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#14293d">Brief</text>
<text x="800" y="241" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#607286">Mission + memories</text>
<text x="800" y="263" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#607286">+ inherited map at entry</text>
<line x1="861" y1="145" x2="966" y2="145" stroke="#dce4ec" stroke-width="2"/>
<polygon points="966,145 957.8959760788259,148.91468980700108 957.8959760788259,141.08531019299892" fill="#dce4ec"/>
<circle cx="1015" cy="145" r="20" fill="#dc6a32" stroke="#dc6a32" stroke-width="2"/>
<text x="1015" y="152" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="white">06</text>
<text x="993" y="205" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#14293d">Resolve</text>
<text x="993" y="241" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#607286">Robot acts, then writes</text>
<text x="993" y="263" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#607286">RESOLVED to the beacon</text>
<rect x="28" y="300" width="1144" height="101" rx="12" fill="#f3f6fa" stroke="none"/>
<polyline points="1100.00,319.00 1100.00,337.00 260.00,337.00 260.00,319.00" fill="none" stroke="#168575" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="260" y1="337" x2="260" y2="318" stroke="#168575" stroke-width="3"/>
<polygon points="260,318 263.9146898070011,326.1040239211741 256.0853101929989,326.1040239211741" fill="#168575"/>
<text x="600" y="366" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#168575">RESULTS RETURN TO THE SAME MEMORY</text>
<text x="600" y="390" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#607286">New advertisements carry the update through the mesh and gateway to the command post.</text>
</svg>
