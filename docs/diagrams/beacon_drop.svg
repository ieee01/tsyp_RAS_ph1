<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc"><title id="title">Beacon deposition and hardware plan</title><desc id="desc">Phase 1 creates, writes and advertises beacon memories at the Writer pose. The physical stop, servo release, reed-switch wake and acknowledgement retry mechanism are Phase 2 work.</desc>
<rect x="0" y="0" width="1200" height="350" rx="0" fill="#ffffff" stroke="none"/>
<text x="32" y="31" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#168575">04 / BEACON DEPOSITION</text>
<text x="32" y="67" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#14293d">Leave memory at a place already reached.</text>
<text x="32" y="96" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#607286">The beacon stays at a safe standoff. Its bearing and range locate the event.</text>
