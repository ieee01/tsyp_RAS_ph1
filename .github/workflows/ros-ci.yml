name: ROS 2 Jazzy CI
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with: {required-ros-distributions: jazzy}
      - uses: ros-tooling/action-ros-ci@v0.3
        with:
          package-name: living_map_interfaces living_map_beacons living_map_radio living_map_gateway living_map_writer living_map_events living_map_executor living_map_sim living_map_dashboard living_map_bringup living_map_command_post living_map_link_sim
          target-ros2-distro: jazzy
          skip-tests: false
      - name: Install Python test dependencies
        run: python3 -m pip install --break-system-packages -r requirements-dev.txt
      - name: Pure Python tests
        run: python3 -m pytest -q tests
