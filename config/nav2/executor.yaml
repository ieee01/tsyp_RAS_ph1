"/executor/bt_navigator":
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: executor/base_link
    odom_topic: /executor/odom
    bt_loop_duration: 10
    default_server_timeout: 100
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator

"/executor/controller_server":
  ros__parameters:
    use_sim_time: true
    controller_frequency: 12.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.3
      movement_time_allowance: 12.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.50
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.35
      lookahead_dist: 0.45
      use_velocity_scaled_lookahead_dist: true
      min_lookahead_dist: 0.45
      max_lookahead_dist: 0.7
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 1.2
      cost_scaling_gain: 0.7
      inflation_cost_scaling_factor: 2.5
      regulated_linear_scaling_min_speed: 0.10
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.2

"/executor/planner_server":
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 10.0
    costmap_update_timeout: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: true
      # The surviving SLAM map can contain gaps; local LiDAR checks new space.
      allow_unknown: true

"/executor/behavior_server":
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    local_frame: executor/odom
    global_frame: map
    robot_base_frame: executor/base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait

"/executor/local_costmap/local_costmap":
  ros__parameters:
    use_sim_time: true
    update_frequency: 8.0
    publish_frequency: 4.0
    global_frame: executor/odom
    robot_base_frame: executor/base_link
    rolling_window: true
    width: 5
    height: 5
    resolution: 0.05
    footprint: "[[0.80, 0.55], [0.80, -0.55], [-0.80, -0.55], [-0.80, 0.55]]"
    footprint_padding: 0.08
    plugins: [obstacle_layer, inflation_layer]
    obstacle_layer:
      plugin: nav2_costmap_2d::ObstacleLayer
      enabled: true
      observation_sources: scan
      scan:
        topic: /executor/scan
        clearing: true
        marking: true
        data_type: LaserScan
        raytrace_max_range: 8.0
        raytrace_min_range: 0.0
        obstacle_max_range: 7.0
        obstacle_min_range: 0.0
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      cost_scaling_factor: 2.5
      inflation_radius: 1.5
    always_send_full_costmap: true

"/executor/global_costmap/global_costmap":
  ros__parameters:
    use_sim_time: true
    update_frequency: 3.0
    publish_frequency: 2.0
    global_frame: map
    robot_base_frame: executor/base_link
    rolling_window: false
    width: 50
    height: 30
    resolution: 0.08
    footprint: "[[0.80, 0.55], [0.80, -0.55], [-0.80, -0.55], [-0.80, 0.55]]"
    footprint_padding: 0.08
    track_unknown_space: true
    plugins: [static_layer, obstacle_layer, inflation_layer]
    static_layer:
      plugin: nav2_costmap_2d::StaticLayer
      map_topic: /executor/navigation_map
      map_subscribe_transient_local: true
      subscribe_to_updates: true
    obstacle_layer:
      plugin: nav2_costmap_2d::ObstacleLayer
      enabled: true
      observation_sources: scan
      scan:
        topic: /executor/scan
        clearing: true
        marking: true
        data_type: LaserScan
        raytrace_max_range: 8.0
        raytrace_min_range: 0.0
        obstacle_max_range: 7.0
        obstacle_min_range: 0.0
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      cost_scaling_factor: 2.5
      inflation_radius: 1.5
    always_send_full_costmap: true
