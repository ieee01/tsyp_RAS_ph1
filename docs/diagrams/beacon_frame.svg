<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc"><title id="title">Beacon wire protocol, version 2, 33 bytes</title><desc id="desc">Byte offsets follow the implementation. Metadata 8 bytes, timestamp 4, position 4, bearing and range 4, event 3, chain 4, TTL 2, CRC32 4. CRC covers bytes zero through twenty-eight.</desc>
